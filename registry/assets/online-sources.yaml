resolution_gate:
  process:
    - discover-current-resolver-capability
    - query-official-manifest-or-api
    - resolve-exact-version-and-transitive-requirements
    - validate-runtime-license-auth-and-network-policy
    - write-dependency-lock-to-visual-bundle
    - render-smoke-test-before-gate2
  guarantee: a source is selectable only after all dependency_completeness fields resolve successfully for the current environment.

fallback_policy:
  unresolved_asset: block-gate2
  source_unavailable_after_gate2: re-resolve-from-declared-fallback-and-repeat-visual-verification
  license_unclear: reject-source
  framework_mismatch: translate-or-select-compatible-source-never-force-runtime-migration
