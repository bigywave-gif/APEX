schema_version: 1
policy:
  storage: metadata-only
  embed_third_party_assets: false
  official_sources_only_for_resolution: true
  require_bundle_lock_at_gate2: true
  prohibit_silent_substitution: true
  inspiration_sources_cannot_be_implementation_dependencies: true
  selection_mode: contextual-multi-factor-assessment
  global_default_source: none
  prohibit_source_forcing: true
  require_selection_record: true
  require_complete_dependency_lock: true
  catalog_model: open-and-extensible-not-a-closed-whitelist

discovery_layers:
  icons:
    - iconify
  components:
    - shadcn-registry
    - official-ecosystem-catalogs
  open_media:
    - openverse-api
    - wikimedia-commons-api
  fonts:
    - google-fonts
    - fontsource
  avatars:
    - dicebear
  rule: discovery layers broaden recall; implementation must resolve to a concrete source, resource ID, license and dependency lock.

sources:
  icons:
    candidates:
      - id: iconify
        role: broad-open-icon-discovery-and-resolution
        official: https://iconify.design/docs/api/
        license: engine-open-source-each-icon-set-has-own-license
        resolvers: [rest-api, web-component, npm, official-site]
        runtimes: [vanilla-js, react, vue, svelte, web-component]
        restrictions: [lock-concrete-icon-set-and-its-license-never-lock-only-iconify]
      - id: lucide
        role: restrained-product-ui-candidate
        official: https://lucide.dev/
        license: ISC
        resolvers: ['skill:better-icons', npm, esm, official-site]
        runtimes: [vanilla-js, react, vue, svelte]
        identity_fields: [icon-name, package-version, size, stroke-width, color-token]
    additional_candidates:
      - id: phosphor
        role: multi-weight-friendly-product-icons
        official: https://phosphoricons.com/
        license: MIT
        resolvers: [rest-api, npm, official-site, 'skill:better-icons']
        runtimes: [vanilla-js, react, vue]
      - id: tabler-icons
        role: dense-admin-and-enterprise-icons
        official: https://tabler.io/icons
        license: MIT
        resolvers: [npm, official-site, 'skill:better-icons']
        runtimes: [vanilla-js, react, vue, svelte]
      - id: heroicons
        role: utility-outline-solid-pairs
        official: https://heroicons.com/
        license: MIT
        resolvers: [npm, official-site, 'skill:better-icons']
        runtimes: [vanilla-js, react, vue]
      - id: simple-icons
        role: brand-logos-only
        official: https://simpleicons.org/
        license: CC0-1.0
        resolvers: [npm, official-site]
        runtimes: [vanilla-js, react]
        restrictions: [verify-brand-guidelines-separately]
      - id: material-symbols
        role: large-variable-google-product-icon-system
        official: https://fonts.google.com/icons
        license: Apache-2.0
        resolvers: [google-fonts-css, npm, official-site]
        runtimes: [vanilla-js, react, vue, svelte]
      - id: fluent-ui-system-icons
        role: large-microsoft-product-icon-system
        official: https://github.com/microsoft/fluentui-system-icons
        license: MIT
        resolvers: [npm, official-source]
        runtimes: [vanilla-js, react, web-components, native-platforms]
      - id: remix-icon
        role: broad-neutral-product-icon-system
        official: https://remixicon.com/
        license: Apache-2.0
        resolvers: [npm, official-site]
        runtimes: [vanilla-js, react-wrapper, vue-wrapper]
      - id: carbon-icons
        role: enterprise-and-data-product-icons
        official: https://carbondesignsystem.com/guidelines/icons/library/
        license: Apache-2.0
        resolvers: [npm, official-site]
        runtimes: [vanilla-js, react, vue, svelte]

  components:
    candidates:
      - id: shadcn-registry
        role: react-tailwind-owned-component-code
        official: https://ui.shadcn.com/docs/registry
        license: MIT
        resolvers: ['mcp:shadcn', cli, registry-api, 'skill:shadcn-ui-reference']
        runtimes: [react-tailwind]
        restrictions: [do-not-force-react-migration]
      - id: radix-primitives
        role: accessible-unstyled-react-primitives
        official: https://www.radix-ui.com/primitives
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react]
        restrictions: [do-not-copy-react-implementation-into-vanilla]
      - id: base-ui
        role: accessible-unstyled-react-components
        official: https://base-ui.com/react/overview/about
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react]
      - id: react-aria-components
        role: accessibility-first-react-components
        official: https://react-spectrum.adobe.com/react-aria/components.html
        license: Apache-2.0
        resolvers: [npm, official-docs]
        runtimes: [react]
      - id: mui-core
        role: comprehensive-material-react-components
        official: https://mui.com/material-ui/
        license: MIT-core
        resolvers: [npm, official-docs]
        runtimes: [react]
        restrictions: [separate-mui-x-community-and-commercial-features]
      - id: ant-design
        role: comprehensive-enterprise-react-components
        official: https://ant.design/docs/react/introduce/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react]
      - id: mantine
        role: comprehensive-customizable-react-components-and-hooks
        official: https://mantine.dev/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react]
      - id: chakra-ui
        role: accessible-token-driven-react-components
        official: https://chakra-ui.com/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react]
      - id: headless-ui
        role: accessible-unstyled-react-and-vue-components
        official: https://headlessui.com/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react, vue]
      - id: primevue
        role: comprehensive-vue-component-suite
        official: https://primevue.org/
        license: MIT-core
        resolvers: [npm, official-docs]
        runtimes: [vue]
      - id: vuetify
        role: material-vue-component-framework
        official: https://vuetifyjs.com/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vue]
      - id: web-awesome
        role: framework-agnostic-web-components
        official: https://webawesome.com/
        license: verify-free-and-pro-boundary
        resolvers: [npm, official-docs]
        runtimes: [web-components, vanilla-js, react, vue]
    vanilla_policy:
      role: native-semantic-html-and-project-components
      resolvers: [existing-project-code, native-web-platform]
      guidance: translate visual and accessibility behavior; do not import a framework solely for a component.

  layout_styles:
    candidates:
      - id: tailwind-css
        role: utility-first-responsive-layout-and-spacing-system
        official: https://tailwindcss.com/docs
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue, svelte]
        required_spec: [utility-pattern, breakpoints, spacing-scale, container-or-grid]
      - id: open-props
        role: framework-agnostic-layout-and-design-token-css-library
        official: https://open-props.style/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue, svelte]
        required_spec: [import-path, layout-pattern, responsive-usage]
    additional_candidates:
      - id: panda-css
        role: typed-token-and-layout-system
        official: https://panda-css.com/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react, vue, vanilla-js]
      - id: bootstrap
        role: production-grid-and-utility-layout-system
        official: https://getbootstrap.com/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue]

  color_systems:
    candidates:
      - id: radix-colors
        role: accessible-semantic-color-scale-system
        official: https://www.radix-ui.com/colors
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue, svelte]
        required_spec: [scale, semantic-token-map, light-dark-mode]
      - id: open-props
        role: semantic-css-color-token-system
        official: https://open-props.style/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue, svelte]
        required_spec: [token-family, semantic-token-map]
    additional_candidates:
      - id: tailwind-colors
        role: utility-color-scale-system
        official: https://tailwindcss.com/docs/colors
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue, svelte]

  tables:
    candidates:
      - id: tanstack-table
        role: headless-table-state-and-behavior
        official: https://tanstack.com/table/latest
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue, svelte, solid]
        required_spec: [columns, data-schema, sorting, filtering, pagination, selection, empty, loading, responsive]
    additional_candidates:
      - id: ag-grid-community
        role: feature-rich-enterprise-grid
        official: https://www.ag-grid.com/javascript-data-grid/
        license: MIT-community-with-enterprise-boundary
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue, angular]
        restrictions: [verify-feature-is-in-community-edition]
      - id: tabulator
        role: feature-rich-framework-agnostic-data-table
        official: https://tabulator.info/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react-wrapper, vue-wrapper]
      - id: datatables
        role: long-running-progressive-enhancement-table
        official: https://datatables.net/
        license: MIT
        resolvers: [npm, official-download-builder, official-docs]
        runtimes: [vanilla-js, jquery, react-wrapper, vue-wrapper]
      - id: mui-x-data-grid
        role: material-react-data-grid
        official: https://mui.com/x/react-data-grid/
        license: MIT-community-with-pro-premium-boundary
        resolvers: [npm, official-docs]
        runtimes: [react]
      - id: react-data-grid
        role: performant-react-data-grid
        official: https://github.com/adazzle/react-data-grid
        license: MIT
        resolvers: [npm, official-source]
        runtimes: [react]

  charts:
    candidates:
      - id: apache-echarts
        role: dashboard-and-interactive-product-charts
        official: https://echarts.apache.org/en/
        license: Apache-2.0
        resolvers: [npm, official-builder, official-docs]
        runtimes: [vanilla-js, react-wrapper, vue-wrapper]
        renderers: [canvas, svg]
        chart_style_contract: [theme-id, theme-mode, palette-tokens, typography-token, grid-and-axis-treatment, tooltip-treatment, series-encoding]
        official_theme_sources: [https://echarts.apache.org/en/download-theme.html, https://echarts.apache.org/handbook/en/concepts/style/]
    additional_candidates:
      - id: vega-lite
        role: declarative-portable-chart-specification
        official: https://vega.github.io/vega-lite/
        license: BSD-3-Clause
        resolvers: [npm, official-editor, official-docs]
        runtimes: [vanilla-js]
      - id: d3
        role: bespoke-data-visualization
        official: https://d3js.org/
        license: ISC
        resolvers: [npm, esm, official-docs]
        runtimes: [vanilla-js]
        restrictions: [use-only-when-standard-chart-library-is-insufficient]
      - id: chart-js
        role: widely-adopted-lightweight-canvas-charts
        official: https://www.chartjs.org/
        license: MIT
        resolvers: [npm, official-cdn, official-docs]
        runtimes: [vanilla-js, framework-wrappers]
      - id: plotly-js
        role: scientific-statistical-3d-and-map-charts
        official: https://plotly.com/javascript/
        license: MIT
        resolvers: [npm, official-cdn, official-docs]
        runtimes: [vanilla-js, react-wrapper]
      - id: observable-plot
        role: concise-grammar-for-exploratory-and-explanatory-charts
        official: https://observablehq.com/plot/
        license: ISC
        resolvers: [npm, esm, official-docs]
        runtimes: [vanilla-js]
      - id: recharts
        role: composable-react-charts
        official: https://recharts.org/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react]
      - id: visx
        role: low-level-react-visualization-components
        official: https://airbnb.io/visx/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [react]

  chart_style_systems:
    candidates:
      - id: echarts-theme-builder
        role: official-echarts-theme-and-palette-materialization
        official: https://echarts.apache.org/en/download-theme.html
        license: Apache-2.0
        resolvers: [official-builder, official-theme-download, generated-source]
        compatible_chart_sources: [apache-echarts]
        required_spec: [theme-id, palette-tokens, typography-token, grid-and-axis-treatment, tooltip-treatment]
      - id: vega-theme
        role: declarative-chart-theme-and-config-system
        official: https://vega.github.io/vega/docs/config/
        license: BSD-3-Clause
        resolvers: [official-docs, generated-source]
        compatible_chart_sources: [vega-lite]
        required_spec: [config-id, palette-tokens, typography-token, grid-and-axis-treatment]
    rule: a chart engine alone is not a chart visual decision; every selected chart must lock one compatible style system and its exact rendering parameters.

  diagrams:
    candidates:
      - id: mermaid
        role: text-defined-flow-sequence-state-and-architecture-diagrams
        official: https://mermaid.js.org/
        license: MIT
        resolvers: [npm, official-live-editor, official-docs]
        runtimes: [vanilla-js, markdown]
    additional_candidates:
      - id: cytoscape-js
        role: interactive-network-and-graph-visualization
        official: https://js.cytoscape.org/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js]
      - id: graphviz-viz-js
        role: graphviz-diagram-rendering-in-browser
        official: https://viz-js.com/
        license: MIT-wrapper-and-EPL-Graphviz-boundary
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, wasm]
      - id: xyflow
        role: interactive-node-based-editors-and-flows
        official: https://xyflow.com/
        license: MIT-core
        resolvers: [npm, official-docs]
        runtimes: [react, svelte]
      - id: elk-js
        role: automatic-graph-layout-engine
        official: https://github.com/kieler/elkjs
        license: EPL-2.0
        resolvers: [npm, official-source]
        runtimes: [vanilla-js, web-worker]

  motion:
    candidates:
      - id: motion
        role: production-motion-for-javascript-and-react
        official: https://motion.dev/docs
        license: MIT
        resolvers: [npm, official-docs, 'skill:motion-ai-kit']
        runtimes: [vanilla-js, react, vue]
    additional_candidates:
      - id: react-bits
        role: expressive-react-pattern-reference
        official: https://www.reactbits.dev/
        license: verify-current-license-and-commons-clause-boundary
        resolvers: ['skill:react-bits', official-source]
        runtimes: [react]
        restrictions: [translate-to-css-js-for-vanilla]
      - id: lottie-web
        role: authored-vector-animation-playback
        official: https://airbnb.io/lottie/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react-wrapper]
        restrictions: [bundle-must-reference-the-animation-json-source-and-license]
      - id: gsap
        role: advanced-timeline-scroll-and-svg-animation
        official: https://gsap.com/docs/v3/
        license: current-GSAP-standard-license-verify-at-use
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, framework-integration]
      - id: anime-js
        role: lightweight-general-javascript-animation
        official: https://animejs.com/documentation/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js]
      - id: auto-animate
        role: zero-config-layout-change-animation
        official: https://auto-animate.formkit.com/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react, vue, svelte]
      - id: rive-runtime
        role: interactive-state-machine-vector-animation
        official: https://rive.app/docs/runtimes/overview
        license: runtime-open-source-editor-and-assets-have-separate-terms
        resolvers: [npm, official-docs]
        runtimes: [canvas, webgl, react, vue]

  photos:
    candidates:
      - id: unsplash-api
        role: editorial-and-product-photography
        official: https://unsplash.com/documentation
        license: Unsplash-API-Terms
        resolvers: [rest-api, official-site]
        auth: api-key
        restrictions: [follow-hotlinking-attribution-and-download-tracking-rules]
    additional_candidates:
      - id: pexels-api
        role: stock-photo-and-video-alternative
        official: https://www.pexels.com/api/documentation/
        license: Pexels-API-Terms
        resolvers: [rest-api, official-site]
        auth: api-key
        restrictions: [follow-attribution-rate-limit-and-use-restrictions]
      - id: openverse-api
        role: broad-openly-licensed-media-discovery
        official: https://api.openverse.org/v1/
        license: API-open-source-each-result-has-own-license
        resolvers: [rest-api, official-site]
        runtimes: [any]
        restrictions: [lock-original-provider-resource-license-creator-and-attribution]
      - id: wikimedia-commons-api
        role: encyclopedic-open-media-repository
        official: https://commons.wikimedia.org/w/api.php
        license: each-resource-has-own-open-license
        resolvers: [mediawiki-api, official-site]
        runtimes: [any]
        restrictions: [lock-file-page-license-author-and-attribution]
      - id: pixabay-api
        role: stock-photo-illustration-video-discovery
        official: https://pixabay.com/api/docs/
        license: Pixabay-content-license-and-API-terms
        resolvers: [rest-api, official-site]
        runtimes: [any]
        restrictions: [follow-rate-limit-caching-and-content-use-rules]

  illustrations:
    candidates:
      - id: undraw
        role: configurable-open-illustrations
        official: https://undraw.co/illustrations
        license: unDraw-license
        resolvers: [manual-official]
        runtimes: [svg, png]
        restrictions: [record-original-page-and-license-snapshot]
    additional_candidates:
      - id: imagegen
        role: custom-project-specific-illustration
        resolver: 'skill:imagegen'
        license: generated-output-policy
        restrictions: [retain-generation-brief-and-output-identity-in-bundle]

  fonts:
    candidates:
      - id: google-fonts
        role: open-web-font-catalog-and-metadata-api
        official: https://developers.google.com/fonts/docs/developer_api
        license: per-family-open-font-license
        resolvers: [rest-api, css-api, official-site]
        auth: api-key-for-developer-api
        required_spec: [family, weights, styles, subsets, loading-strategy, fallback-stack]
      - id: fontsource
        role: npm-packaged-open-font-distribution
        official: https://fontsource.org/
        license: per-font-license
        resolvers: [npm, official-api, official-site]
        runtimes: [vanilla-js, react, vue, svelte]

  avatars:
    candidates:
      - id: dicebear
        role: deterministic-open-avatar-api
        official: https://www.dicebear.com/how-to-use/http-api/
        license: package-MIT-each-avatar-style-has-own-license
        resolvers: [rest-api, npm, official-site]
        runtimes: [any]
        restrictions: [lock-style-seed-options-version-and-style-license]

  maps:
    candidates:
      - id: maplibre-gl-js
        role: open-source-vector-map-rendering
        official: https://maplibre.org/maplibre-gl-js/docs/
        license: BSD-3-Clause
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, framework-wrappers]
        restrictions: [map-renderer-does-not-include-tile-provider-or-data-license]
      - id: leaflet
        role: lightweight-interactive-web-maps
        official: https://leafletjs.com/
        license: BSD-2-Clause
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, framework-wrappers]
        restrictions: [lock-tile-provider-data-license-and-attribution]

  three_d:
    candidates:
      - id: three-js
        role: general-webgl-3d-rendering
        official: https://threejs.org/
        license: MIT
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js, react-wrapper]
      - id: babylon-js
        role: full-featured-web-3d-engine
        official: https://www.babylonjs.com/
        license: Apache-2.0
        resolvers: [npm, official-docs]
        runtimes: [vanilla-js]

selection:
  dimensions:
    - visual-fit
    - functional-coverage
    - runtime-fit
    - accessibility
    - performance
    - maintenance-and-stability
    - license-and-governance
    - resolver-availability
    - design-to-code-fidelity
  required_record:
    - candidatesConsidered
    - selectedBecause
    - rejectedBecause
    - selectionDate
    - runtimeTarget
  rule: select the best-fit candidate for the current task; list order and candidate grouping are discovery aids only and never mandatory.

dependency_completeness:
  required:
    - resolved-version-or-api-version
    - package-or-service-entrypoint
    - required-modules-and-plugins
    - peer-dependencies
    - style-font-image-worker-wasm-dependencies
    - runtime-and-browser-requirements
    - credentials-rate-limit-and-network-policy
    - license-and-service-terms-snapshot
    - integrity-revision-or-resource-id
    - fallback-compatibility
  unresolved: block-gate2-and-evaluate-another-candidate

catalog_completeness:
  required_categories: [icons, components, tables, charts, diagrams, motion, photos, illustrations, fonts, avatars, maps, three_d]
  coverage_rule: every category must have multiple concrete candidates or one broad discovery layer plus concrete implementation candidates.
  expansion_rule: when no registered candidate satisfies the task, search official sources, evaluate the new candidate, append it to this registry, then continue selection.
  freshness_rule: popularity, version, maintenance and license signals are resolved at selection time rather than frozen as permanent rankings.

resolver_catalog:
  iconify:
    packages: [iconify-icon, '@iconify/json', '@iconify/utils']
    api: https://api.iconify.design/
    resolve_at_use: [api-or-package-version, collection-prefix, icon-name, collection-license, svg-data, web-component-or-inline-mode]
  lucide:
    packages: [lucide, lucide-static, lucide-react, lucide-vue-next, lucide-svelte]
    metadata: https://lucide.dev/llms.txt
    resolve_at_use: [exact-package-version, selected-framework-package, svg-viewbox, stroke-parameters]
  phosphor:
    packages: ['@phosphor-icons/web', '@phosphor-icons/react', '@phosphor-icons/vue']
    api: https://api.phosphoricons.com/docs
    resolve_at_use: [exact-package-version, icon-version, weight, framework-entrypoint]
  tabler-icons:
    packages: ['@tabler/icons', '@tabler/icons-react', '@tabler/icons-vue', '@tabler/icons-svelte']
    resolve_at_use: [exact-package-version, framework-entrypoint, icon-name]
  heroicons:
    packages: ['@heroicons/react', '@heroicons/vue']
    vanilla_resolver: official-svg-source
    resolve_at_use: [exact-package-version-or-svg-revision, style-variant, icon-name]
  simple-icons:
    packages: [simple-icons]
    resolve_at_use: [exact-package-version, brand-slug, brand-guideline-check]
  material-symbols:
    packages: ['material-symbols', '@material-symbols/font-400']
    service: https://fonts.googleapis.com/
    resolve_at_use: [package-or-css-revision, icon-name, axes, subset, font-or-svg-mode]
